name: Update jobs & publish

on:
  schedule:
    - cron: "17 4,10,16 * * *" # ≈ 06:17, 12:17, 18:17 Dresden time (UTC+2 in summer)
  workflow_dispatch: # "Run workflow" button in the Actions tab = refresh now
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore description cache
        uses: actions/cache@v6
        with:
          path: data/details_cache.json
          key: details-${{ github.run_id }}
          restore-keys: details-

      - name: Fetch listings from the Bundesagentur für Arbeit
        run: python app.py --refresh

      - name: Save listings to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/jobs.json data/seen.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update job listings ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v5
